[package]
name = "tool-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM core logic migrated with rust-anything parity checks for Tool Web & Android"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
